name: Publish MyTESY Cloud validated releases
on:
  workflow_run:
    workflows:
      - Validate MyTESY Cloud
    types:
      - completed
permissions:
  contents: write
jobs:
  publish:
    name: Publish validated release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Publish v1.1.4 if validated
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$CURRENT_SHA" == "$VALIDATED_SHA" ]] || exit 0
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/tesy/manifest.json"))["version"])')"
          [[ "$VERSION" == "1.1.4" ]] || exit 0
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release already published"; exit 0
          fi
          gh release create "v$VERSION" \
            --target "$VALIDATED_SHA" \
            --title "MyTESY Cloud v$VERSION" \
            --notes-file RELEASE_NOTES_1.1.4.md \
            --latest
