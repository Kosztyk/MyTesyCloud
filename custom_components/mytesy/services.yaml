reset_history:
  name: Reset TESY energy and runtime history
  description: Reset integration-managed history for all devices or a specified MAC (destructive).
  fields:
    entry_id:
      name: MyTESY account entry ID (optional)
      selector:
        text:
    mac:
      name: Device MAC (optional)
      selector:
        text:
set_program_interval:
  name: Set TESY program interval (advanced)
  description: Writes one weekly heating interval. Confirmed working by the maintainer on TESY CN06AS firmware 4.79; select the correct program number.
  fields:
    entry_id:
      name: MyTESY account entry ID (optional)
      description: Select the account when multiple accounts contain the same MAC address.
      selector:
        text:
    mac:
      required: true
      selector:
        text:
    day:
      required: true
      selector:
        number:
          min: 0
          max: 7
          mode: box
    from:
      required: true
      selector:
        text:
    to:
      required: true
      selector:
        text:
    temp:
      required: true
      selector:
        number:
          min: 5
          max: 35
          mode: box
    program_number:
      required: true
      selector:
        number:
          min: 1
          max: 255
          mode: box
delete_program_interval:
  name: Delete TESY program interval (advanced)
  description: Deletes a single program number from a device; confirm the number in the mobile app first.
  fields:
    entry_id:
      name: MyTESY account entry ID (optional)
      description: Select the account when multiple accounts contain the same MAC address.
      selector:
        text:
    mac:
      required: true
      selector:
        text:
    program_number:
      required: true
      selector:
        number:
          min: 1
          max: 255
          mode: box

manage_group:
  name: Manage TESY cloud group
  description: Create/edit/delete groups or add a device using the Android app REST API.
  fields:
    entry_id:
      name: MyTESY account entry ID (optional)
      description: Required when multiple MyTESY accounts are configured.
      selector:
        text:
    operation:
      required: true
      selector:
        select:
          options: [create, edit, delete, add_device]
    name:
      selector:
        text:
    id:
      selector:
        number:
          min: 1
          max: 999999
    group_id:
      selector:
        number:
          min: 1
          max: 999999
    mac:
      selector:
        text:
    devices:
      selector:
        object:
